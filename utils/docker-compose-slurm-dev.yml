services:
  slurm_master:
        image: slurm_master_img:1.0
        hostname: slurm_master
        user: admin
        volumes:
                - shared-vol:/home/admin
        ports:
                - 6817:6817
                - 6818:6818
                - 6819:6819
        networks:
          vpcbr:
            ipv4_address: 10.5.0.5
  slurm_node1:
        image: slurm_node_img:1.0
        hostname: slurm_node1
        user: admin
        volumes:
                - shared-vol:/home/admin
        links:
                - slurm_master
        networks:
          vpcbr:
            ipv4_address: 10.5.0.6
volumes:
        shared-vol:

networks:
  vpcbr:
    driver: bridge
    ipam:
     config:
        - subnet: 10.5.0.0/16
          gateway: 10.5.0.1