# Config cgroup for slurm
CgroupMountpoint=/sys/fs/cgroup

#CgroupAutomount=yes
#CgroupReleaseAgentDir="/etc/slurm/cgroup"

ConstrainCores=yes
ConstrainDevices=yes
#TaskAffinity=yes
ConstrainRAMSpace=yes
#ConstrainSwapSpace=yes
MaxRAMPercent=95
AllowedSwapSpace=0
AllowedRAMSpace=200
MemorySwappiness=0

