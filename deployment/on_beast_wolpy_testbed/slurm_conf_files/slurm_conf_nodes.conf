# slurm.conf — wolpy testbed, compute node variant (wolpy06-08)
# Place this file on each compute node at /etc/slurm/slurm.conf

SlurmctldHost=wolpy05
MpiDefault=none
ProctrackType=proctrack/cgroup
Prolog=/etc/slurm/slurm.prolog
ReturnToService=2
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmctldPort=6817
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
SlurmUser=slurm
SlurmdUser=root
StateSaveLocation=/var/spool/slurm-state
SwitchType=switch/none
TaskPlugin=task/affinity,task/cgroup
UsePAM=1
LaunchParameters=disable_send_gids

# TIMERS
InactiveLimit=0
KillWait=30
MinJobAge=300
SlurmctldTimeout=120
SlurmdTimeout=300
Waittime=0

# SCHEDULING
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

# LOGGING AND ACCOUNTING
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
ClusterName=beast
JobCompLoc=/var/log/slurm/JobComp.log
JobCompType=jobcomp/filetxt
JobAcctGatherFrequency=30
JobAcctGatherType=jobacct_gather/none
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log

# COMPUTE NODES
GresTypes=qpu
NodeName=wolpy[06-08] Gres=qpu:1 CPUs=144 Boards=1 SocketsPerBoard=2 CoresPerSocket=36 ThreadsPerCore=2 RealMemory=200000
PartitionName=wolpyqpu Nodes=wolpy[06-08] State=UP MaxTime=7-0 OverSubscribe=EXCLUSIVE
