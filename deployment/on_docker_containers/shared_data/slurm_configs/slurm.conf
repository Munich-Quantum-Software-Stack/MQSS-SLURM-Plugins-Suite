# slurm.conf file generated by configurator easy.html.
# Put this file on all nodes of your cluster.
# See the slurm.conf man page for more information.
#
ClusterName=slurmcluster
SlurmctldHost=slurmmaster
#
#MailProg=/bin/mail
#MpiDefault=
#MpiParams=ports=#-#
#ProctrackType=proctrack/cgroup
ProctrackType=proctrack/linuxproc
ReturnToService=1
SlurmctldPidFile=/run/slurm/slurmctld.pid
#SlurmctldPort=6817
SlurmdPidFile=/run/slurm/slurmd.pid
#SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
SlurmUser=slurm
#SlurmdUser=root
StateSaveLocation=/var/spool/slurmctld
#SwitchType=
TaskPlugin=task/affinity,task/cgroup
#
#
# TIMERS
#KillWait=30
#MinJobAge=300
#SlurmctldTimeout=120
#SlurmdTimeout=300
#
#
# PROLOG
#Prolog=/etc/slurm/prolog_script_node1.sh
#PrologFlags=Alloc
#
# SCHEDULING
SchedulerType=sched/backfill
SelectType=select/cons_tres
#
#
# LOGGING AND ACCOUNTING
#AccountingStorageType=
#JobAcctGatherFrequency=30
#JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherType=jobacct_gather/linux
SlurmctldDebug=debug
SlurmctldLogFile=/var/log/slurm/slurmctld.log
#SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log
#
#
# COMPUTE NODES
NodeName=slurmnode1 NodeAddr=slurmnode1 CPUs=4 RealMemory=10240 Sockets=4 CoresPerSocket=1 ThreadsPerCore=1 State=UNKNOWN
PartitionName=testbed Nodes=slurmnode1 Default=YES MaxTime=INFINITE State=UP
